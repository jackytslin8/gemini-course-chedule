<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程進度管理 (115學年度上學期)</title>
    <style>
        :root {
            --primary-color: #f27227;
            --bg-color: #f5f6fa;
            --text-color: #2f3640;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px; margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: #2c3e50; }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

        button, .btn-label {
            cursor: pointer; border: none; padding: 8px 16px; border-radius: 6px;
            font-size: 14px; font-weight: 600; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }

        .btn-export { background-color: #3498db; color: white; }
        .btn-export:hover { background-color: #2980b9; }
        .btn-import { background-color: #9b59b6; color: white; }
        .btn-import:hover { background-color: #8e44ad; }
        .btn-stats { background-color: #1abc9c; color: white; }
        .btn-stats:hover { background-color: #16a085; }

        .month-nav {
            display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;
        }
        .month-nav button { background-color: #ecf0f1; color: #7f8c8d; }
        .month-nav button:hover { background-color: #bdc3c7; }
        .month-nav button.active { background-color: var(--primary-color); color: white; box-shadow: 0 2px 5px rgba(242, 114, 39, 0.4); }

        .calendar-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; box-shadow: 0 0 0 1px var(--border-color); }
        .calendar-container { min-width: 800px; }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); background-color: var(--primary-color); color: white; font-weight: bold; text-align: center; }
        .calendar-header div { padding: 12px; border-right: 1px solid rgba(255,255,255,0.2); }
        .calendar-header div:last-child { border-right: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background-color: var(--border-color); gap: 1px; }

        .day { background-color: white; min-height: 120px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; transition: background 0.2s; }
        .day:hover { background-color: #fafbfc; }
        .day.empty { background-color: #f8f9fa; cursor: default; }
        .day.weekend { background-color: #fafafa; }
        
        .day-top-bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        
        .day-num { font-size: 15px; font-weight: bold; color: #7f8c8d; }
        .day.today .day-num {
            background-color: #e74c3c; color: white; width: 24px; height: 24px;
            text-align: center; border-radius: 50%; line-height: 24px; display: inline-block;
        }

        .lunar-date { font-size: 12px; color: #95a5a6; }
        .lunar-date.holiday { color: #e74c3c; font-weight: bold; font-size: 11px; }

        .day-content { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        
        .class-entry-label { font-size: 13px; line-height: 1.4; word-break: break-word; padding: 4px; border-radius: 4px; background: #f1f2f6; }
        .class-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #2c3e50; margin-right: 4px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .quick-select { margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; }
        .quick-select button { background: white; color: #2c3e50; border: 1px solid #bdc3c7; padding: 6px 10px; margin: 3px; }
        .quick-select button:hover { background: #e2e8ed; }

        .entry-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .input-class { width: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .input-text { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-del { background: transparent; color: #e74c3c; font-size: 18px; padding: 4px; border-radius: 4px; }
        .btn-del:hover { background: #ffebee; }

        .modal-actions { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add-custom { background-color: #f39c12; color: white; }
        .btn-add-custom:hover { background-color: #e67e22; }
        .btn-save { background-color: #2ecc71; color: white; margin-left: 10px; }
        .btn-save:hover { background-color: #27ae60; }
        .btn-cancel { background-color: #95a5a6; color: white; }
        .btn-cancel:hover { background-color: #7f8c8d; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: #f8f9fa; border: 1px solid #e1e8ed; border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card .count { display: block; margin-top: 8px; font-size: 22px; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📖 課程進度管理 (115學年度上學期)</h1>
        <div class="controls">
            <button class="btn-export" onclick="exportData()">💾 匯出備份 (JSON)</button>
            <label class="btn-label btn-import">
                📤 匯入備份
                <input type="file" accept=".json" onchange="importData(event)" style="display:none">
            </label>
            <button class="btn-export" onclick="cloudSync()" style="background:#1abc9c; color:white;">☁️ 雲端同步</button>
            <button class="btn-stats" onclick="showStats()">📊 進度統計</button>
        </div>
        <div style="margin-top:8px; font-size:12px; color:#666; text-align:center;">
            <span id="cloudStatus">☁️ 雲端：未連線</span>
        </div>
    </header>

    <div class="month-nav" id="monthNav"></div>

    <div class="calendar-wrapper">
        <div class="calendar-container">
            <div class="calendar-header">
                <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">編輯進度</h2>
        <div class="quick-select">
            <div style="font-weight:bold; margin-bottom:8px; font-size:14px;">⚡️ 點擊快速新增班級：</div>
            <button onclick="addClassEntry('506')">506</button>
            <button onclick="addClassEntry('605')">605</button>
            <button onclick="addClassEntry('606')">606</button>
            <button onclick="addClassEntry('609')">609</button>
            <button onclick="addClassEntry('610')">610</button>
            <button onclick="addClassEntry('604')">604</button>
            <button onclick="addClassEntry('108')">108</button>
        </div>
        <div id="entryList"></div>
        <div class="modal-actions">
            <button class="btn-add-custom" onclick="addClassEntry('')">➕ 新增自訂列</button>
            <div>
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="saveData()">儲存進度</button>
            </div>
        </div>
    </div>
</div>

<div id="statsModal" class="modal">
    <div class="modal-content">
        <h2>📊 各班級授課節數統計</h2>
        <div id="statsList" class="stats-grid"></div>
        <div class="modal-actions" style="justify-content: flex-end;">
            <button class="btn-cancel" onclick="closeStats()">關閉</button>
        </div>
    </div>
</div>

<script>
    const targetMonths = [
        { year: 2026, month: 9, label: '9月' }, { year: 2026, month: 10, label: '10月' },
        { year: 2026, month: 11, label: '11月' }, { year: 2026, month: 12, label: '12月' }, { year: 2027, month: 1, label: '1月' }
    ];

    const classColors = {
        '506': '#bbdefb', '605': '#f8bbd0', '606': '#c8e6c9',
        '609': '#ffe0b2', '610': '#e1bee7', '604': '#b2ebf2', '108': '#ffcdd2'
    };

    // 內建離線農曆與節日資料庫 (涵蓋 2026/09/01 ~ 2027/01/31)
    const lunarData = {"2026-09-01": "二十", "2026-09-02": "廿一", "2026-09-03": "廿二", "2026-09-04": "廿三", "2026-09-05": "廿四", "2026-09-06": "廿五", "2026-09-07": "廿六 白露", "2026-09-08": "廿七", "2026-09-09": "廿八", "2026-09-10": "廿九", "2026-09-11": "八月", "2026-09-12": "初二", "2026-09-13": "初三", "2026-09-14": "初四", "2026-09-15": "初五", "2026-09-16": "初六", "2026-09-17": "初七", "2026-09-18": "初八", "2026-09-19": "初九", "2026-09-20": "初十", "2026-09-21": "十一", "2026-09-22": "十二", "2026-09-23": "十三 秋分", "2026-09-24": "十四", "2026-09-25": "十五 中秋節", "2026-09-26": "十六", "2026-09-27": "十七", "2026-09-28": "十八 教師節", "2026-09-29": "十九", "2026-09-30": "二十", "2026-10-01": "廿一", "2026-10-02": "廿二", "2026-10-03": "廿三", "2026-10-04": "廿四", "2026-10-05": "廿五", "2026-10-06": "廿六", "2026-10-07": "廿七", "2026-10-08": "廿八 寒露", "2026-10-09": "廿九", "2026-10-10": "九月 國慶日", "2026-10-11": "初二", "2026-10-12": "初三", "2026-10-13": "初四", "2026-10-14": "初五", "2026-10-15": "初六", "2026-10-16": "初七", "2026-10-17": "初八", "2026-10-18": "初九 重陽節", "2026-10-19": "初十", "2026-10-20": "十一", "2026-10-21": "十二", "2026-10-22": "十三", "2026-10-23": "十四 霜降", "2026-10-24": "十五", "2026-10-25": "十六 光復節", "2026-10-26": "十七", "2026-10-27": "十八", "2026-10-28": "十九", "2026-10-29": "二十", "2026-10-30": "廿一", "2026-10-31": "廿二", "2026-11-01": "廿三", "2026-11-02": "廿四", "2026-11-03": "廿五", "2026-11-04": "廿六", "2026-11-05": "廿七", "2026-11-06": "廿八", "2026-11-07": "廿九 立冬", "2026-11-08": "三十", "2026-11-09": "十月", "2026-11-10": "初二", "2026-11-11": "初三", "2026-11-12": "初四", "2026-11-13": "初五", "2026-11-14": "初六", "2026-11-15": "初七", "2026-11-16": "初八", "2026-11-17": "初九", "2026-11-18": "初十", "2026-11-19": "十一", "2026-11-20": "十二", "2026-11-21": "十三", "2026-11-22": "十四 小雪", "2026-11-23": "十五", "2026-11-24": "十六", "2026-11-25": "十七", "2026-11-26": "十八", "2026-11-27": "十九", "2026-11-28": "二十", "2026-11-29": "廿一", "2026-11-30": "廿二", "2026-12-01": "廿三", "2026-12-02": "廿四", "2026-12-03": "廿五", "2026-12-04": "廿六", "2026-12-05": "廿七", "2026-12-06": "廿八", "2026-12-07": "廿九 大雪", "2026-12-08": "三十", "2026-12-09": "冬月", "2026-12-10": "初二", "2026-12-11": "初三", "2026-12-12": "初四", "2026-12-13": "初五", "2026-12-14": "初六", "2026-12-15": "初七", "2026-12-16": "初八", "2026-12-17": "初九", "2026-12-18": "初十", "2026-12-19": "十一", "2026-12-20": "十二", "2026-12-21": "十三", "2026-12-22": "十四 冬至", "2026-12-23": "十五", "2026-12-24": "十六", "2026-12-25": "十七 行憲日", "2026-12-26": "十八", "2026-12-27": "十九", "2026-12-28": "二十", "2026-12-29": "廿一", "2026-12-30": "廿二", "2026-12-31": "廿三", "2027-01-01": "廿四 元旦", "2027-01-02": "廿五", "2027-01-03": "廿六", "2027-01-04": "廿七", "2027-01-05": "廿八 小寒", "2027-01-06": "廿九", "2027-01-07": "三十", "2027-01-08": "臘月", "2027-01-09": "初二", "2027-01-10": "初三", "2027-01-11": "初四", "2027-01-12": "初五", "2027-01-13": "初六", "2027-01-14": "初七", "2027-01-15": "初八", "2027-01-16": "初九", "2027-01-17": "初十", "2027-01-18": "十一", "2027-01-19": "十二", "2027-01-20": "十三 大寒", "2027-01-21": "十四", "2027-01-22": "十五", "2027-01-23": "十六", "2027-01-24": "十七", "2027-01-25": "十八", "2027-01-26": "十九", "2027-01-27": "二十", "2027-01-28": "廿一", "2027-01-29": "廿二", "2027-01-30": "廿三", "2027-01-31": "廿四"};

    let _parsedData = JSON.parse(localStorage.getItem('courseScheduleData')) || {};
    // 相容舊版：舊版是純 {日期:[...]}；新版是 {v: 版本号, data: {日期:[...]}}
    let scheduleData;
    let cloudRev = 0;
    if (_parsedData && typeof _parsedData === 'object' && 'v' in _parsedData) {
        scheduleData = _parsedData.data || {};
        cloudRev = _parsedData.v || 0;
    } else {
        scheduleData = (_parsedData && typeof _parsedData === 'object') ? _parsedData : {};
    }
    let currentMonthIdx = 0;
    let editingDate = null;
    let tempEntries = [];

    // ============ 雲端同步（Firebase RTDB，免登入免授權） ============
    // 同步規則：比較版本号 (cloudRev)，較大者全量覆蓋較小者（刪除也會同步）
    const CLOUD = {
        baseUrl: "https://course-81bea-default-rtdb.asia-southeast1.firebasedatabase.app",
        path: "courseData"
    };
    let cloudBusy = false;

    function setCloudStatus(msg, cls) {
        const el = document.getElementById('cloudStatus');
        if (!el) return;
        el.textContent = msg;
        el.style.color = cls === 'ok' ? '#1abc9c' : (cls === 'error' ? '#e74c3c' : (cls === 'busy' ? '#3498db' : '#888'));
    }

    function cloudConfigured() {
        return CLOUD.baseUrl && CLOUD.baseUrl.startsWith("https://");
    }

    // 持久化本地（新版 {v, data} 格式）
    function persistLocal() {
        localStorage.setItem('courseScheduleData', JSON.stringify({ v: cloudRev, data: scheduleData }));
    }

    // 讀雲端 → {v, data}（舊節點沒有 v 就 v=0）
    async function cloudFetch() {
        if (!cloudConfigured()) return null;
        setCloudStatus('☁️ 連線中...', 'busy');
        try {
            const resp = await fetch(`${CLOUD.baseUrl}/${CLOUD.path}.json`, { cache: 'no-store' });
            if (!resp.ok) {
                setCloudStatus('☁️ 連線失敗', 'error');
                return null;
            }
            const node = await resp.json();
            if (!node || typeof node !== 'object') {
                setCloudStatus('☁️ 雲端無資料', 'busy');
                return null;
            }
            if ('v' in node) {
                setCloudStatus('☁️ 已連線', 'ok');
                return { v: node.v || 0, data: node.data || {} };
            }
            // 舊格式（沒有 v 欄位）
            setCloudStatus('☁️ 已連線（舊格式）', 'ok');
            return { v: 0, data: node };
        } catch (err) {
            setCloudStatus('☁️ 連線失敗，請稍後再試', 'error');
            return null;
        }
    }

    // 全量上傳（以本地為準）
    async function cloudPush() {
        if (!cloudConfigured() || cloudBusy) return;
        cloudBusy = true;
        setCloudStatus('☁️ 上傳中...', 'busy');
        try {
            const resp = await fetch(`${CLOUD.baseUrl}/${CLOUD.path}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ v: cloudRev, data: scheduleData })
            });
            const t = new Date();
            const hh = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            if (resp.ok) {
                setCloudStatus(`☁️ 已同步 ${hh}`, 'ok');
            } else {
                setCloudStatus(`☁️ 上傳失敗 (${resp.status})，請再試`, 'error');
            }
        } catch (err) {
            setCloudStatus('☁️ 上傳失敗（網路錯誤），請再試', 'error');
        } finally {
            cloudBusy = false;
        }
    }

    // 方向性同步：版本号大的覆蓋小的
    async function applySyncDirection(remote) {
        if (!remote) return;
        if (remote.v > cloudRev) {
            // 雲端較新 → 完全以雲端為準（本地多餘的會被清掉，避免「刪了又回來」）
            scheduleData = remote.data;
            cloudRev = remote.v;
            persistLocal();
            if (document.getElementById('statsModal').style.display === 'block') showStats();
            renderCalendar();
            setCloudStatus('☁️ 已載入雲端最新資料', 'ok');
        } else if (cloudRev > remote.v) {
            // 本地較新 → 上傳
            await cloudPush();
        }
    }

    // 開頁面時自動同步
    async function autoCloudSync() {
        if (!cloudConfigured()) return;
        const remote = await cloudFetch();
        await applySyncDirection(remote);
    }

    // 手動「☁️ 雲端同步」按鈕
    async function cloudSync() {
        if (!cloudConfigured()) {
            alert('雲端同步尚未啟用');
            return;
        }
        const remote = await cloudFetch();
        await applySyncDirection(remote);
    }

    document.addEventListener('DOMContentLoaded', () => { renderCalendar(); autoCloudSync(); });

    function getClassColor(cid) { return classColors[cid] || '#e0e0e0'; }

    function renderCalendar() {
        const monthInfo = targetMonths[currentMonthIdx];
        const year = monthInfo.year;
        const month = monthInfo.month;

        document.getElementById('monthNav').innerHTML = targetMonths.map((m, idx) =>
            `<button class="${idx === currentMonthIdx ? 'active' : ''}" onclick="changeMonth(${idx})">
                ${m.year === 2027 ? '116年' : '115年'}${m.label}
            </button>`
        ).join('');

        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month, 0).getDate();

        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        for (let i = 0; i < startOffset; i++) {
            grid.innerHTML += `<div class="day empty"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayData = scheduleData[dateStr] || [];
            
            let contentHtml = dayData.map(d => 
                `<div class="class-entry-label">
                    <span class="class-badge" style="background:${getClassColor(d.classId)}">${d.classId}</span>${d.text}
                </div>`
            ).join('');

            const isWeekend = (startOffset + day - 1) % 7 >= 5;
            const weekendClass = isWeekend ? 'weekend' : '';
            const todayClass = dateStr === todayStr ? 'today' : '';

            // 農曆與節日標籤處理
            const lunarText = lunarData[dateStr] || '';
            const hasHoliday = lunarText.includes(' '); // 判斷是否帶有節日(因為字典裡的節氣/節日都有空一格)
            const lunarHtml = lunarText ? `<span class="lunar-date ${hasHoliday ? 'holiday' : ''}">${lunarText}</span>` : '';

            grid.innerHTML += `
                <div class="day ${weekendClass} ${todayClass}" onclick="openModal('${dateStr}')">
                    <div class="day-top-bar">
                        <span class="day-num">${day}</span>
                        ${lunarHtml}
                    </div>
                    <div class="day-content">${contentHtml}</div>
                </div>
            `;
        }
    }

    function changeMonth(idx) { currentMonthIdx = idx; renderCalendar(); }

    function openModal(dateStr) {
        editingDate = dateStr;
        document.getElementById('modalTitle').innerText = `📅 ${dateStr} 課程進度`;
        tempEntries = JSON.parse(JSON.stringify(scheduleData[dateStr] || []));
        if(tempEntries.length === 0) tempEntries.push({ classId: '', text: '' });
        renderEntries();
        document.getElementById('editModal').style.display = 'flex';
    }

    function renderEntries() {
        const list = document.getElementById('entryList');
        list.innerHTML = tempEntries.map((entry, idx) => `
            <div class="entry-row">
                <input type="text" class="input-class" value="${entry.classId}" placeholder="班級" onchange="updateEntry(${idx}, 'classId', this.value)">
                <input type="text" class="input-text" value="${entry.text}" placeholder="輸入進度 (如: 作業社練P2~3)" 
                    onchange="updateEntry(${idx}, 'text', this.value)" onkeyup="if(event.key === 'Enter') saveData()">
                <button class="btn-del" onclick="removeEntry(${idx})" title="刪除此列">✖</button>
            </div>
        `).join('');
    }

    function addClassEntry(classId) {
        tempEntries.push({ classId: classId, text: '' });
        renderEntries();
        setTimeout(() => {
            const inputs = document.querySelectorAll('.input-text');
            if(inputs.length > 0) inputs[inputs.length - 1].focus();
        }, 50);
    }

    function updateEntry(idx, field, value) { tempEntries[idx][field] = value; }
    function removeEntry(idx) { tempEntries.splice(idx, 1); renderEntries(); }

    function saveData() {
        const validEntries = tempEntries.filter(e => e.classId.trim() !== '');
        if (validEntries.length > 0) scheduleData[editingDate] = validEntries;
        else delete scheduleData[editingDate];
        cloudRev = Date.now(); // 存檔 = 新版本號（刪除也會同步）
        persistLocal();
        cloudPush(); // 自動上傳雲端
        closeModal(); renderCalendar();
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    function showStats() {
        const counts = {};
        for (const date in scheduleData) {
            scheduleData[date].forEach(entry => {
                const cid = entry.classId.trim();
                if (cid) counts[cid] = (counts[cid] || 0) + 1;
            });
        }
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        const list = document.getElementById('statsList');
        if (sorted.length === 0) list.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">目前尚無任何教學進度紀錄。</p>';
        else list.innerHTML = sorted.map(([cid, count]) => `
            <div class="stat-card">
                <span class="class-badge" style="background:${getClassColor(cid)}; font-size:16px; padding:4px 10px;">${cid}</span>
                <span class="count">${count} 節課</span>
            </div>
        `).join('');
        document.getElementById('statsModal').style.display = 'flex';
    }

    function closeStats() { document.getElementById('statsModal').style.display = 'none'; }

    function exportData() {
        const blob = new Blob([JSON.stringify(scheduleData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url;
        const now = new Date();
        a.download = `課程進度備份_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}.json`;
        a.click(); URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                if (confirm('確定要匯入並覆蓋現有資料嗎？此動作將無法還原。')) {
                    scheduleData = JSON.parse(e.target.result);
                    cloudRev = Date.now();
                    persistLocal();
                    cloudPush();
                    renderCalendar(); alert('資料匯入成功！');
                }
            } catch (err) { alert('匯入失敗：這不是一個有效的 JSON 備份檔案。'); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.onclick = function(event) {
        if (event.target === document.getElementById('editModal')) closeModal();
        if (event.target === document.getElementById('statsModal')) closeStats();
    }
</script>
</body>
</html>
